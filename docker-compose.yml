services:
  postgres:
    image: postgres:16
    container_name: tongtin-postgres
    environment:
      POSTGRES_DB: tongtin
      POSTGRES_USER: tongtin
      POSTGRES_PASSWORD: tongtin
    ports:
      - "5432:5432"
    volumes:
      - tongtin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tongtin -d tongtin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tongtin_pgdata:
